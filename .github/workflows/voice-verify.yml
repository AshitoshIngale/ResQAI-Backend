name: Voice Session Verification

# Temporary diagnostic: verifies the browser-free AI voice session endpoints
# from GitHub's IPs (immune to the Cloudflare edge challenges that hit
# scripted POSTs from the developer's machine). Results are committed back
# to the repository so they can be read without authentication.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/voice-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run voice session verification
        env:
          BACKEND_URL: "https://resqai-backend-n128.onrender.com"
          TEST_EMAIL: "slowprobe.a1b2c3@example.com"
          TEST_PASSWORD: "SlowProbe!2026x"
        run: |
          python - <<'PYEOF'
          import json, urllib.request, urllib.error, uuid, time, os

          BASE = os.environ["BACKEND_URL"] + "/api"

          def call(path, payload=None, token=None):
              req = urllib.request.Request(BASE + path)
              req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              data = json.dumps(payload).encode() if payload is not None else None
              last = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, data=data, timeout=90) as r:
                          return r.status, json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()
                      return e.code, json.loads(body) if body.strip().startswith("{") else {}
                  except Exception as ex:
                      last = ex
                      time.sleep(10)
              raise RuntimeError(f"retries exhausted: {last}")

          lines = []
          def log(msg):
              lines.append(msg)
              print(msg, flush=True)

          st, login = call("/v1/auth/login", {
              "identifier": os.environ["TEST_EMAIL"],
              "password": os.environ["TEST_PASSWORD"]})
          log(f"login: {st}")
          token = login.get("accessToken")

          st, me = call("/v1/users/me", token=token)
          code = me.get("emergencyCode")
          log(f"users/me: {st}, code={str(code)[:6]}...")

          rid = str(uuid.uuid4())
          st, rep = call("/v1/bystander/reports", {
              "reportId": rid, "emergencyCode": code, "category": "ROAD_ACCIDENT",
              "latitude": 16.70, "longitude": 74.24,
              "clientCreatedAt": int(time.time()*1000), "source": "QR_SCAN",
              "bystanderConsent": True, "bystanderPhone": "+917676941547",
              "bystanderLanguage": "en"})
          log(f"report: {st} identity={rep.get('identityVerification')} "
              f"ambulance={rep.get('callStatus')}")

          # APP PATH (v1 prefix), NO AUTH HEADER - the exact request the app makes
          st, vs = call(f"/v1/emergency/{rid}/voice/session",
                        {"language": "en", "micConsent": True})
          token_ok = bool(vs.get("token"))
          log(f"voice session (no auth): {st}, token={token_ok}, "
              f"patient={vs.get('patientName')}, reconnected={vs.get('reconnected')}")

          st2, vs2 = call(f"/v1/emergency/{rid}/voice/session",
                          {"language": "en", "micConsent": True})
          log(f"voice session replay: {st2}, reconnected={vs2.get('reconnected')}")

          verdict = ("PASS" if token_ok and st == 200 else "FAIL")
          log(f"VERDICT: {verdict}")

          result = ("# Voice Session Verification\\n\\n" +
                    "\\n".join("- " + l for l in lines) +
                    f"\\n\\n**VERDICT: {verdict}**\\n")
          with open("voice-verify-result.md", "w") as f:
              f.write(result)
          PYEOF

      - name: Commit result
        run: |
          git config user.name "resqai-verify-bot"
          git config user.email "actions@resqai.local"
          mkdir -p docs
          cp voice-verify-result.md docs/voice-verify-result.md
          git add docs/voice-verify-result.md
          git commit -m "voice session verification result (auto)" || echo "nothing to commit"
          git push
