spring.application.name=resqai-backend

# --- Server -----------------------------------------------------
# Render injects PORT; local default is 8080
server.port=${PORT:8080}

# --- MongoDB ----------------------------------------------------
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:resqai}
spring.data.mongodb.auto-index-creation=false

# --- JWT --------------------------------------------------------
resqai.jwt.secret=${JWT_SECRET:local-dev-secret-replace-in-production-min-32-bytes-ok}
resqai.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
resqai.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}

# --- Verification behaviour -------------------------------------
resqai.email-verification-ttl-minutes=${EMAIL_VERIFICATION_TTL_MINUTES:30}
resqai.phone-otp-ttl-minutes=${PHONE_OTP_TTL_MINUTES:10}
resqai.phone-otp-max-attempts=${PHONE_OTP_MAX_ATTEMPTS:5}
resqai.reset-token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:30}
resqai.mail.from=${MAIL_FROM:no-reply@resqai.local}

# --- Production email provider (leave unset for TEST MODE) ------
# spring.mail.host=${SMTP_HOST}
# spring.mail.port=587
# spring.mail.username=${SMTP_USER}
# spring.mail.password=${SMTP_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# --- Production SMS provider (leave unset for TEST MODE) --------
# resqai.sms.provider=twilio
# resqai.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID}
# resqai.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN}
# resqai.sms.twilio.from-number=${TWILIO_FROM_NUMBER}

# --- CORS (browsers only; the Android app needs none) -----------
resqai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Actuator: health endpoint only ------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.forward-headers-strategy=native
